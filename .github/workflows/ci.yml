name: 车市镜 CI

# study_code 是多项目仓库；本工作流只验证 `车市镜/` 子项目。
on:
  pull_request:
    paths:
      - '车市镜/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [ master ]
    paths:
      - '车市镜/**'
      - '.github/workflows/ci.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 车市镜
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 使用子项目维护的轻量 CI 依赖，不安装 torch/sentence-transformers/PDF/浏览器运行时。
      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements-ci.txt
      # 排除需要真实数据库/模型的 integration；评测红线读取已提交的干净报告。
      - name: 单元测试 + 评测红线
        env:
          LLM_API_KEY: dummy
        run: python -m pytest tests/ -m "not integration" -q

  # 仅在合并到 master 后构建镜像；PR 阶段先完成单测与报告门禁。
  build-images:
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 车市镜
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 校验 prod compose 配置
        run: |
          cp .env.prod.example .env.prod
          cd deploy && docker compose --env-file ../.env.prod -f docker-compose.prod.yml config -q
      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./车市镜
          file: ./车市镜/deploy/Dockerfile.api
          push: false
          tags: carmirror-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./车市镜
          file: ./车市镜/deploy/Dockerfile.web
          push: false
          tags: carmirror-web:ci
      # 可选：推 GHCR（去掉注释 + 配 packages 写权限即可）；部署到服务器走 SSH/watchtower。
      # - name: 登录 GHCR
      #   uses: docker/login-action@v3
      #   with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
